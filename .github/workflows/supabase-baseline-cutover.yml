name: Supabase Baseline Cutover

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only backup or restore-gated ledger repair
        required: true
        type: choice
        options:
          - backup
          - repair
      age_recipient:
        description: Public age recipient for the encrypted backup artifact
        required: false
        type: string
      expected_application_sha256:
        description: Restore-tested application snapshot SHA-256
        required: false
        type: string
      expected_ledger_sha256:
        description: Restore-tested production ledger SHA-256
        required: false
        type: string
      expected_superseded_count:
        description: Exact number of production ledger entries to revert
        required: false
        default: "62"
        type: string
      expected_pending_versions:
        description: Comma-separated migrations expected after ledger repair
        required: false
        default: "20260827083034"
        type: string
      restore_manifest_sha256:
        description: SHA-256 of the locally verified plaintext backup manifest
        required: false
        type: string
      confirmation:
        description: Must equal repair-<baseline-version> for ledger repair
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-baseline-cutover
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.0

defaults:
  run:
    shell: bash

jobs:
  cutover:
    name: ${{ inputs.operation == 'backup' && 'Backup production database' || 'Repair production migration ledger' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      SCHEMA_DEPLOY_TARGET: production
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Require main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Supabase baseline cutover can only run from refs/heads/main."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration contract
        run: pnpm run verify:migrations

      - name: Validate cutover inputs
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_APPLICATION_SHA256: ${{ inputs.expected_application_sha256 }}
          EXPECTED_LEDGER_SHA256: ${{ inputs.expected_ledger_sha256 }}
          RESTORE_MANIFEST_SHA256: ${{ inputs.restore_manifest_sha256 }}
          CUTOVER_OPERATION: ${{ inputs.operation }}
        run: bash ./.github/scripts/supabase-baseline-cutover.sh validate

      - name: Configure ephemeral libpq service
        run: bash ./.github/scripts/supabase-baseline-cutover.sh configure

      - name: Install age
        if: inputs.operation == 'backup'
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Export production backup
        if: inputs.operation == 'backup'
        env:
          AGE_RECIPIENT: ${{ inputs.age_recipient }}
          CUTOVER_SNAPSHOT_FILE: ${{ runner.temp }}/founderops-cutover-backup/production-snapshot.json
        run: bash ./.github/scripts/supabase-baseline-cutover.sh backup

      - name: Upload encrypted production backup
        if: inputs.operation == 'backup'
        uses: actions/upload-artifact@v6
        with:
          name: founderops-production-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/founderops-production-backup.tar.gz.age
            ${{ runner.temp }}/founderops-production-backup.tar.gz.age.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Repair production migration ledger
        if: inputs.operation == 'repair'
        env:
          BASELINE_CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
          CUTOVER_OUTPUT_DIR: ${{ runner.temp }}/founderops-cutover-repair
          EXPECTED_APPLICATION_SHA256: ${{ inputs.expected_application_sha256 }}
          EXPECTED_LEDGER_SHA256: ${{ inputs.expected_ledger_sha256 }}
          EXPECTED_PENDING_VERSIONS: ${{ inputs.expected_pending_versions }}
          EXPECTED_SUPERSEDED_COUNT: ${{ inputs.expected_superseded_count }}
          RESTORE_MANIFEST_SHA256: ${{ inputs.restore_manifest_sha256 }}
        run: bash ./.github/scripts/supabase-baseline-cutover.sh repair

      - name: Upload ledger repair evidence
        if: inputs.operation == 'repair'
        uses: actions/upload-artifact@v6
        with:
          name: founderops-ledger-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/founderops-cutover-repair
          if-no-files-found: error
          retention-days: 14

      - name: Remove plaintext cutover files
        if: always()
        run: bash ./.github/scripts/supabase-baseline-cutover.sh cleanup
